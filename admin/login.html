<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — DJ Chaudhary Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #060912;
      color: #f1f5f9;
    }
    .text-gradient-gold {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 50%, #d97706 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-card {
      background: rgba(14, 21, 38, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 relative overflow-hidden">
  <!-- Subtle ambient light blobs -->
  <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-blue-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="w-full max-w-md relative z-10">
    <!-- Header Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-amber-600 p-0.5 shadow-xl shadow-amber-500/20 mb-4">
        <div class="w-full h-full bg-[#0d1322] rounded-[14px] flex items-center justify-center text-amber-400 font-bold font-mono text-xl">
          DJ
        </div>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-white tracking-tight">
        Admin <span class="text-gradient-gold">Control Panel</span>
      </h1>
      <p class="text-slate-400 text-xs sm:text-sm font-mono mt-1">
        DJ Chaudhary Portfolio — Firebase Auth
      </p>
    </div>

    <!-- Login Form Card -->
    <div class="glass-card rounded-2xl p-6 sm:p-8 border border-slate-800 shadow-2xl space-y-6">
      <div id="alertBox" class="hidden p-3.5 rounded-xl text-xs font-mono border"></div>

      <form id="loginForm" class="space-y-5">
        <div>
          <label class="block text-xs font-mono text-slate-400 uppercase mb-2">Admin Email</label>
          <input
            type="email"
            id="adminEmail"
            placeholder="admin@djchaudhary.dev"
            class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
            required
            value="admin@djchaudhary.dev"
          />
        </div>

        <div>
          <label class="block text-xs font-mono text-slate-400 uppercase mb-2">Password</label>
          <input
            type="password"
            id="adminPassword"
            placeholder="••••••••••••"
            class="w-full px-4 py-3 bg-slate-900 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition-colors"
            required
            value="admin123"
          />
        </div>

        <button
          type="submit"
          id="loginBtn"
          className="w-full py-3.5 rounded-xl font-bold text-slate-950 text-sm bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-300 hover:to-amber-500 shadow-lg shadow-amber-500/20 transition-all flex items-center justify-center space-x-2"
        >
          <span>Sign In To Dashboard</span>
        </button>
      </form>

      <!-- Quick Demo Access Option -->
      <div class="pt-4 border-t border-slate-800/80 text-center space-y-3">
        <p class="text-xs text-slate-500">Need instant admin access?</p>
        <button
          type="button"
          id="demoAdminBtn"
          class="w-full py-2.5 rounded-xl text-xs font-mono text-amber-400 bg-amber-500/10 hover:bg-amber-500/20 border border-amber-500/30 transition-colors"
        >
          ⚡ Quick Demo Login (Auto-Register / Admin Pass)
        </button>
        <a href="/" class="inline-block text-xs text-slate-400 hover:text-white font-mono mt-2 transition-colors">
          ← Back to Main Portfolio Website
        </a>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth } from '../js/firebase-config.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const loginForm = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const demoAdminBtn = document.getElementById('demoAdminBtn');

    function showAlert(msg, isError = true) {
      alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      if (isError) {
        alertBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
      } else {
        alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      }
      alertBox.textContent = msg;
    }

    // Auto check if already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = '/admin/dashboard.html';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value.trim();

      try {
        showAlert('Authenticating with Firebase...', false);
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        console.warn('Login attempt error:', err);
        // Try creating the user if account doesn't exist yet for seamless first setup
        if (err.code === 'auth/user-not-found' || err.code === 'auth/invalid-credential') {
          try {
            await createUserWithEmailAndPassword(auth, email, password);
            window.location.href = '/admin/dashboard.html';
            return;
          } catch (createErr) {
            showAlert('Authentication failed: ' + (createErr.message || 'Invalid credentials'));
            return;
          }
        }
        showAlert('Login error: ' + (err.message || 'Check email/password'));
      }
    });

    demoAdminBtn.addEventListener('click', async () => {
      const email = 'admin@djchaudhary.dev';
      const password = 'adminPassword123!';
      try {
        showAlert('Signing in as Demo Admin...', false);
        await signInWithEmailAndPassword(auth, email, password);
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          window.location.href = '/admin/dashboard.html';
        } catch (cErr) {
          showAlert('Demo Login failed: ' + cErr.message);
        }
      }
    });
  </script>
</body>
</html>
